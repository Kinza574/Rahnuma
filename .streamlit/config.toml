[theme]
base = "light"
primaryColor = "#7A2E3A"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#F1ECE5"
textColor = "#1F1F1F"
borderColor = "#E4DED6"
showWidgetBorder = true
baseRadius = "small"
font = "sans-serif"
headingFont = "serif"
headingFontWeights = 600

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
